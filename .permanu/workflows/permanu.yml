name: Permanu SDK CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: Explicit CI lane to run manually.
        required: true
        type: choice
        default: pr
        options:
          - pr
          - main
          - release
          - all

permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: read

concurrency:
  group: permanu-sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  pr-quality:
    name: permanu-ci / sdk / pr-quality
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go SDK tests
        working-directory: go
        run: go test ./...

      - name: Prepare Node SDK package manager
        working-directory: node
        run: |
          set -eu
          if command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
          else
            npm install
          fi

      - name: Node SDK build
        working-directory: node
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun run build
          else
            npm run build
          fi

      - name: Node SDK tests
        working-directory: node
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun test
          else
            npm test
          fi

  release-packages:
    name: permanu-ci / sdk / release-packages
    needs: [pr-quality]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Node SDK
        working-directory: node
        run: |
          mkdir -p ../dist
          if command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
          elif command -v npm >/dev/null 2>&1; then
            npm install
          else
            echo "Neither bun nor npm is available for Node SDK packaging" >&2
            exit 1
          fi
          if command -v npm >/dev/null 2>&1; then
            npm pack --pack-destination ../dist
          else
            tar -czf ../dist/permanu-sdk-node-source.tar.gz package.json src tsconfig.json bun.lockb bun.lock 2>/dev/null || \
              tar -czf ../dist/permanu-sdk-node-source.tar.gz package.json src tsconfig.json
          fi

      - name: Package Go SDK source
        run: |
          mkdir -p dist
          tar -czf dist/permanu-sdk-go-source.tar.gz go
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload package preview
        uses: actions/upload-artifact@v4
        with:
          name: permanu-sdk-packages
          path: dist/
          retention-days: 30
